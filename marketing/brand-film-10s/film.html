function scene(t){let n=starts.findLastIndex(s=>s<=t);n=Math.max(0,n);scenes[n](t-starts[n]);if(n<4){let at=starts[n+1],dur=.23;if(t>at-dur){let k=io((t-at+dur)/dur);ctx(()=>{c.beginPath();if(n===0){for(let j=0;j<4;j++){let p=io(clamp((t-at+dur)/dur*1.4-j*.10));c.rect(j*270,0,271,H*p)}}else if(n===2){c.moveTo(540,1010-2100*k);c.lineTo(540+2100*k,1010);c.lineTo(540,1010+2100*k);c.lineTo(540-2100*k,1010);c.closePath()}else{c.arc(n===1?906:540,n===1?1234:1010,2250*k,0,TAU)}c.clip();scenes[n+1](0)})}}}

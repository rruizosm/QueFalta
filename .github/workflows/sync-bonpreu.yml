name: Sync BonpreuEsclat catalog

on:
  schedule:
    # Un lote cada 12 horas. Un ciclo normal de 142 categorías termina en
    # 12 ejecuciones (unos 6 días), sin concentrar todo el tráfico en una sesión.
    - cron: '30 4,16 * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-bonpreu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Bonpreu exige navegador real (AWS WAF). El lockfile fija Playwright y
      # Chromium para evitar que un `npm install playwright` cambie el fingerprint.
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node scripts/sync-bonpreu.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          BONPREU_BATCH_SIZE: '12'
          CATEGORY_API_DELAY_MS: '500'
          # Las fichas abren documentos protegidos uno a uno. Conservamos las
          # columnas existentes y pausamos su backfill hasta migrarlo a una API.
          SKIP_DETAIL: '1'
          DETAIL_CONCURRENCY: '2'
          DETAIL_MAX: '500'

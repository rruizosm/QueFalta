name: Sync Froiz catalog

on:
  schedule:
    - cron: '40 5 * * *' # diario, tras Gadis para evitar picos simultáneos
  workflow_dispatch: {}

concurrency:
  group: sync-froiz
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-froiz.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

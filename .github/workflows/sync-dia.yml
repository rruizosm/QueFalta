name: Sync Dia catalog (manual diagnostic)

on:
  # Desde 2026-09-14 Akamai devuelve 403 al SSR de dia.es desde runners
  # alojados de GitHub/Azure. El sync operativo se ejecuta en Windows con
  # scripts/run-dia-sync.ps1; este workflow queda solo para comprobar a mano
  # si DIA levanta el bloqueo en el futuro.
  workflow_dispatch: {}

concurrency:
  group: sync-dia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El SSR es Vike, pero su frontal Akamai puede bloquear IPs de datacenter.
      - run: node scripts/sync-dia.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          CONCURRENCY: '6'
      - name: Actualizar capa del comparador
        run: node scripts/sync-comparator-embedding-catalog.mjs
        env:
          STORES: dia
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

name: Sync Gadis catalog

on:
  schedule:
    - cron: '20 5 * * 1' # lunes 05:20 UTC
  workflow_dispatch: {}

concurrency:
  group: sync-gadis
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-gadis.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          CONCURRENCY: '4'
      - name: Actualizar capa del comparador
        run: node scripts/sync-comparator-embedding-catalog.mjs
        env:
          STORES: gadis
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

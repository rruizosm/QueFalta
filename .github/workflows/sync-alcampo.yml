name: Sync Alcampo catalog

on:
  workflow_dispatch: {} # Solo diagnóstico manual: el sync productivo se ejecuta localmente.

concurrency:
  group: sync-alcampo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 80   # es-only; ~25k productos por hojas + ficha incremental (fetch puro)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Alcampo va por la API REST de Ocado (product-pages) + HTML de la PDP para la
      # ficha, con una cookie de sesión anónima. Sin navegador: solo node.
      - run: node scripts/sync-alcampo.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          CONCURRENCY: '6'
          DETAIL_CONCURRENCY: '4'
      - name: Actualizar capa del comparador
        run: node scripts/sync-comparator-embedding-catalog.mjs
        env:
          STORES: alcampo
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

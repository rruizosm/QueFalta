<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Referencia de diseño (Claude Design — "Mejorar indicaciones de pasos").
  Coach-mark del PASO 2 del guided tour (Obre el catàleg). Implementado en
  src/context/GuidedTourContext.tsx como señales animadas (anillo que pulsa +
  chevron que rebota + pico de la tarjeta) sobre el objetivo. NO se renderiza
  en la app: es solo el mock original. El runtime <x-dc>/support.js no se incluye.
-->
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  @keyframes ringPulse {
    0%   { box-shadow: 0 0 0 0 rgba(234,78,44,.55); }
    70%  { box-shadow: 0 0 0 18px rgba(234,78,44,0); }
    100% { box-shadow: 0 0 0 0 rgba(234,78,44,0); }
  }
  @keyframes arrowBob {
    0%,100% { transform: translate(-50%, 0); }
    50%     { transform: translate(-50%, 9px); }
  }
  @keyframes tapPing {
    0%   { transform: translate(-50%,-50%) scale(.6); opacity:.5; }
    80%  { transform: translate(-50%,-50%) scale(1.5); opacity:0; }
    100% { opacity:0; }
  }
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#EEECE6;font-family:'Hanken Grotesk',sans-serif;color:#2B2723;-webkit-font-smoothing:antialiased;">

  <!-- ============ APP LAYER (normal brightness) ============ -->
  <div style="position:absolute;inset:0;">

    <!-- status bar -->
    <div style="height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;">
      <div style="font-size:17px;font-weight:700;letter-spacing:.3px;">20:20</div>
      <div style="display:flex;align-items:center;gap:7px;">
        <svg width="19" height="13" viewBox="0 0 19 13" fill="#2B2723"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1" opacity=".35"/></svg>
        <svg width="18" height="13" viewBox="0 0 18 13" fill="none" stroke="#2B2723" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.5 A11 11 0 0 1 17 4.5"/><path d="M4 7.5 A7 7 0 0 1 14 7.5"/><path d="M7 10.5 A3 3 0 0 1 11 10.5"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="1" y="1" width="22" height="11" rx="3.2" stroke="#2B2723" stroke-width="1.4" opacity=".5"/><rect x="3" y="3" width="11" height="7" rx="1.6" fill="#2B2723"/><rect x="24.5" y="4.2" width="1.6" height="4.6" rx="0.8" fill="#2B2723" opacity=".5"/></svg>
      </div>
    </div>

    <!-- header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:14px 22px 0;">
      <div>
        <div style="font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.5px;">Hola, Ruben 👋</div>
        <div style="font-size:18px;color:#8A8178;font-weight:500;margin-top:6px;">Què necessites avui?</div>
      </div>
      <div style="width:54px;height:54px;border-radius:50%;background:#3E3EC6;border:2.5px solid #9E2B1A;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex:none;">RU</div>
    </div>

    <!-- cistella activa card -->
    <div style="margin:26px 22px 0;background:#8E2C1B;border:2.5px solid #241008;border-radius:6px;box-shadow:7px 7px 0 #241008;padding:18px;color:#fff;">
      <div style="display:flex;align-items:center;gap:16px;">
        <div style="width:54px;height:54px;background:#A2402F;border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h2l2.5 12h11l2-8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;letter-spacing:1.5px;color:#E8B9AF;">CISTELLA ACTIVA</div>
          <div style="font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:2px;">Familia</div>
        </div>
        <div style="font-size:30px;font-weight:800;color:#E8B9AF;">0/0</div>
      </div>
    </div>

    <!-- explora el catàleg card -->
    <div style="margin:26px 22px 0;background:#EEECE6;border:2.5px solid #241008;border-radius:6px;box-shadow:7px 7px 0 #241008;padding:16px;">
      <div style="display:flex;align-items:center;gap:16px;">
        <div style="width:54px;height:54px;background:#A2402F;border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-size:23px;font-weight:800;letter-spacing:-.3px;">Afegeix a la cistella!</div>
          <div style="font-size:17px;color:#8A8178;font-weight:500;margin-top:2px;">Explora el catàleg</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ============ BOTTOM NAV (normal) ============ -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:86px;background:#EEECE6;border-top:1px solid #DCD9D2;display:flex;align-items:flex-start;padding-top:14px;z-index:5;">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:14px;font-weight:700;color:#B23A26;">Inici</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:14px;font-weight:600;color:#9A9189;">Catàleg</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:14px;font-weight:600;color:#9A9189;">Cistella</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="font-size:14px;font-weight:600;color:#9A9189;">Grups</div>
    </div>
  </div>

  <!-- ============ DIM OVERLAY ============ -->
  <div style="position:absolute;inset:0;background:rgba(54,38,30,.55);z-index:10;"></div>

  <!-- SPOTLIGHT: pestaña Catàleg (anillo que pulsa + tap ping) -->
  <!-- BOUNCING CHEVRON apuntando a la pestaña -->
  <!-- COACH-MARK CARD con beak sobre la pestaña: "Obre el catàleg" / "Pas 2 de 6" -->
  <!-- (ver implementación real en src/context/GuidedTourContext.tsx) -->

</div>
</x-dc>
</body>
</html>

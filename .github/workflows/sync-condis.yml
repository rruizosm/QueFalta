name: Sync Condis catalog

on:
  schedule:
    - cron: '0 10 * * 1'   # lunes 10:00 UTC (tras Caprabo), semanal
  workflow_dispatch: {}     # botón "Run workflow" para lanzarlo a mano / probar

concurrency:
  group: sync-condis
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # catálogo bilingüe + backfill incremental de fichas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Empathy sirve el catálogo; Playwright inicia la sesión OAuth anónima necesaria
      # para descargar después las fichas RSC por HTTP reutilizando sus cookies.
      - run: npm install playwright && npx playwright install --with-deps chromium
      - run: node scripts/sync-condis.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          CONCURRENCY: '6'
          DETAIL_CONCURRENCY: '6'
          DETAIL_MAX: '1000'
      - name: Actualizar capa del comparador
        run: node scripts/sync-comparator-embedding-catalog.mjs
        env:
          STORES: condis
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

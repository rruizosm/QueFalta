name: Sync Mercadona catalog

on:
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC (08:00 peninsular en verano / 07:00 en invierno)
  workflow_dispatch: {}    # botón "Run workflow" para lanzarlo a mano / probar

# Evita solapamientos si una ejecución tarda más de lo normal.
concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # multi-almacén: barre ~48 almacenes (uno por provincia)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-catalog.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          # EAN (detalle por producto): incremental y deliberadamente pequeño. El
          # catálogo multi-almacén es prioritario; un backfill masivo de fichas provoca
          # 403 de Mercadona y puede agotar el job. Para acelerar el histórico usar el
          # runner reanudable scripts/backfill-mercadona-ean.mjs fuera de este workflow.
          EAN_MAX: '300'
          EAN_CONCURRENCY: '2'
      - name: Actualizar capa del comparador
        run: node scripts/sync-comparator-embedding-catalog.mjs
        env:
          STORES: mercadona
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

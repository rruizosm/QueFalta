name: Sync Caprabo catalog

on:
  workflow_dispatch: {}     # Solo diagnóstico manual: el sync productivo se ejecuta localmente.

concurrency:
  group: sync-caprabo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # catálogo + hasta 1.000 fichas nutricionales incrementales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Mismo backend que Eroski (Tapestry): solo fetch de node, sin navegador.
      - run: node scripts/sync-caprabo.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          CONCURRENCY: '6'
          # Ante una caída/bloqueo breve de la home, el script reintenta durante ~10 min.
          HOME_RETRY_ROUNDS: '4'
          HOME_RETRY_DELAYS_SECONDS: '60,180,360'
          DETAIL_CONCURRENCY: '3'
          DETAIL_MAX: '1000'

name: Sync BM catalog

on:
  schedule:
    - cron: '15 12 * * 1' # lunes 12:15 UTC, semanal
  workflow_dispatch: {}

concurrency:
  group: sync-bm
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sincronizar catalogo multizona BM
        run: node scripts/sync-bm.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          CONCURRENCY: '6'
          REQUEST_DELAY_MS: '80'
          MIN_LOCATIONS: '7'
          MIN_PRODUCTS: '6500'
          MIN_COVERAGE_RATIO: '0.97'
      - name: Actualizar capa del comparador
        run: node scripts/sync-comparator-embedding-catalog.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          STORES: bm

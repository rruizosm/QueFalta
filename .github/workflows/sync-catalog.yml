name: Sync Mercadona catalog

on:
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC (08:00 peninsular en verano / 07:00 en invierno)
  workflow_dispatch: {}    # botón "Run workflow" para lanzarlo a mano / probar

# Evita solapamientos si una ejecución tarda más de lo normal.
concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # multi-almacén: barre ~48 almacenes (uno por provincia)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-catalog.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          # EAN (detalle por producto): incremental. Tope por run para que el arranque
          # en frío (~6.400 detalles) quepa en el timeout junto al barrido multi-almacén;
          # se completa en ~2 runs y luego solo pide el de las novedades.
          EAN_MAX: '6400'
          EAN_CONCURRENCY: '6'


[functions.catalog-embed]
enabled = true
verify_jwt = false
import_map = "./functions/catalog-embed/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/catalog-embed/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/catalog-embed/*.html" ]

[functions.process-price-alerts]
enabled = true
verify_jwt = false
entrypoint = "./functions/process-price-alerts/index.ts"

[functions.revenuecat-webhook]
enabled = true
# RevenueCat no envía un JWT de Supabase. La función valida en su lugar el
# header Authorization contra el secreto RC_WEBHOOK_TOKEN.
verify_jwt = false
entrypoint = "./functions/revenuecat-webhook/index.ts"

[functions.sync-plus-subscription]
enabled = true
# Solo usuarios autenticados pueden confirmar su propio appUserID. La función
# vuelve a validar el JWT antes de consultar RevenueCat y escribir el perfil.
verify_jwt = true
entrypoint = "./functions/sync-plus-subscription/index.ts"

name: Catalog embedding maintenance

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: catalog-embedding-maintenance
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar autovacuum y HNSW
        run: node scripts/check-catalog-embedding-maintenance.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

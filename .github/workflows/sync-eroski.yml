name: Sync Eroski catalog

on:
  schedule:
    - cron: '0 9 * * 1'    # lunes 09:00 UTC (tras Sorli; pesado, 21k), semanal
  workflow_dispatch: {}     # botón "Run workflow" para lanzarlo a mano / probar

concurrency:
  group: sync-eroski
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # catálogo grande + hasta 1.000 fichas nutricionales incrementales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Eroski/Caprabo son HTML plano (framework Tapestry): solo fetch de node,
      # sin navegador (SSR del 1er lote + POST loadpage con cookies de sesión).
      - run: node scripts/sync-eroski.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          CONCURRENCY: '6'
          # Ante una caída/bloqueo breve de la home, el script reintenta durante ~10 min.
          HOME_RETRY_ROUNDS: '4'
          HOME_RETRY_DELAYS_SECONDS: '60,180,360'
          DETAIL_CONCURRENCY: '3'
          DETAIL_MAX: '1000'
